global:
  scrape_interval: 5s
  scrape_timeout: 3s
scrape_configs:
  - job_name: anomaly-sandbox
    static_configs:
      - targets: [controls:8081]
remote_write:
  - url: http://mimir:9009/api/v1/push
    headers:
      X-Scope-OrgID: local-sandbox
    queue_config:
      min_shards: 1
      max_shards: 1
      batch_send_deadline: 1s
