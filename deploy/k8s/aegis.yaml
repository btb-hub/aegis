apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aegis
  template:
    metadata:
      labels:
        app: aegis
    spec:
      containers:
        - name: aegis
          image: ghcr.io/btb-hub/aegis:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: aegis-env
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aegis
spec:
  selector:
    app: aegis
  ports:
    - port: 80
      targetPort: 3000
