# Example oauth2-proxy config (v7.15.3) for an optional outer Google gate in front of Aegis.
# Aegis does not run this process. Copy into your Ingress / sidecar and fill secrets.
# Docs: docs/07-setup-deployment.md (Outer identity proxy)
#
# Register a second Google OAuth client (or a second authorized redirect URI):
#   https://<ui-host>/oauth2/callback
# Do not reuse Aegis GOOGLE_OIDC_REDIRECT_URL ({PUBLIC_URL}/auth/google/callback).
# After this gate, users still sign in to Aegis with /auth/{provider}/login.

http_address = "0.0.0.0:4180"
reverse_proxy = true
# Trust the TLS terminator in front. Cookie Secure needs HTTPS on the public origin.
upstreams = ["http://aegis:80/"]

provider = "google"

# Same exact host as cookie_domains (or omit cookie_domains for a host-only cookie).
redirect_url = "https://aegis.example.com/oauth2/callback"
client_id = ""
client_secret = ""
# 16, 24, or 32 bytes (or base64 of that). Empty or short values fail at start or mint invalid cookies.
cookie_secret = ""

# Exact host only — must match redirect_url. A parent domain (".example.com") duplicates CSRF
# cookies across hosts and causes instant 403 in a normal Chrome profile while Incognito works.
cookie_domains = ["aegis.example.com"]
cookie_secure = true
cookie_samesite = "lax"
cookie_csrf_per_request = true
# Default 15m. Shorter values 403 users who spend time on the Google chooser or 2FA.
cookie_csrf_expire = "15m"

# Force the Google account chooser so Chrome does not silently reuse a personal Gmail session.
prompt = "select_account"
# Replace example.com with your Workspace domain. "*" allows any email.
email_domains = ["example.com"]

# REQ-INT-07: machine HTTP must skip the interactive proxy (or use a second public host).
# Prefer the in-cluster Service for kube probes, not the public proxy host.
# Do not leave /metrics on the public internet without a network policy.
skip_auth_routes = [
  "GET=^/healthz$",
  "GET=^/readyz$",
  "GET=^/metrics$",
  "^/api/v1/alerts/webhook/?$",
  "^/api/v1/callbacks/",
]
